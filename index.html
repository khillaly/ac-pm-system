<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC PM System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <div class="logo">❄️</div>
            <h1>AC PM System</h1>
            <p>Enter your 4-digit PIN</p>
            
            <div class="pin-display" id="pin-display">----</div>
            <div class="error-msg" id="error-msg"></div>

            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key clear" onclick="clearPin()">C</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key enter" onclick="submitPin()">✓</button>
            </div>
        </div>
    </div>

    
       <!-- ================= TECHNICIAN DASHBOARD ================= -->
    <div id="tech-dashboard" class="screen">
        <div class="dashboard-box">
            <h2>Select Department</h2>
            <p>Welcome, <span id="tech-name"></span></p>
            <button class="logout-btn" onclick="logout()">Logout</button>
            <button class="report-btn" onclick="showReportsScreen()">📊 View Reports / History</button>
            
            <!-- Department Selection Grid -->
            <div class="dept-grid" id="dept-grid">
                <!-- Buttons will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- ================= AC SELECTION SCREEN ================= -->
    <div id="ac-selection-screen" class="screen">
        <div class="dashboard-box">
            <h2 id="selected-dept-title">Department</h2>
            <button class="back-btn" onclick="goBackToDepts()">← Back</button>
            
            <div class="form-group">
                <label>Select AC Unit (Tag Number / Location)</label>
                <select id="ac-dropdown" onchange="fillACDetails()">
                    <option value="">-- Select an AC Unit --</option>
                    <!-- Options will be generated by JavaScript -->
                </select>
            </div>

            <!-- Auto-filled Details -->
            <div id="ac-details" class="ac-details" style="display:none;">
                <div class="detail-row"><strong>Tag:</strong> <span id="detail-tag"></span></div>
                <div class="detail-row"><strong>Type:</strong> <span id="detail-type"></span></div>
                <div class="detail-row"><strong>Brand:</strong> <span id="detail-brand"></span></div>
                <div class="detail-row"><strong>Model:</strong> <span id="detail-model"></span></div>
                <div class="detail-row"><strong>Serial:</strong> <span id="detail-serial"></span></div>
                
                <button class="start-pm-btn" onclick="startPMChecklist()">Start PM Checklist</button>
            </div>
        </div>
    </div>
    <!-- ================= PM CHECKLIST SCREEN ================= -->
    <div id="pm-checklist-screen" class="screen">
        <div class="dashboard-box">
            <h2>PM Checklist</h2>
            <div id="checklist-ac-info" class="ac-details" style="margin-bottom: 15px;">
                <!-- AC details will be loaded here -->
            </div>
            
            <div id="checklist-container" class="checklist-container">
                <!-- Checklist items will be generated by JavaScript -->
            </div>

            <div class="signature-section">
                <label>Technician Signature:</label>
                <canvas id="signature-pad" width="300" height="150"></canvas>
                <button class="clear-sig-btn" onclick="clearSignature()">Clear Signature</button>
            </div>

            <button class="submit-pm-btn" onclick="submitPM()">Submit PM for Approval</button>
            <button class="back-btn" onclick="goBackToACSelection()" style="width: 100%; margin-top: 10px;">Cancel</button>
        </div>
    </div>
        <!-- ================= IN-CHARGE DASHBOARD ================= -->
    <div id="incharge-dashboard" class="screen">
        <div class="dashboard-box">
            <h2>In-Charge Dashboard</h2>
            <p>Welcome, <span id="incharge-name"></span></p>
            <p>Department: <span id="incharge-dept"></span></p>
            <button class="logout-btn" onclick="logout()">Logout</button>
            <button class="report-btn" onclick="showReportsScreen()">📊 View Reports / History</button>
            
            <div class="pending-list" id="pending-list-container">
                <!-- Pending PMs will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- ================= PM APPROVAL DETAIL SCREEN ================= -->
    <div id="pm-approval-screen" class="screen">
        <div class="dashboard-box">
            <h2>Review PM Record</h2>
            <button class="back-btn" onclick="goBackToPendingList()">← Back</button>
            
            <div id="approval-ac-info" class="ac-details" style="margin-bottom: 15px;"></div>
            <div id="approval-checklist-view" class="checklist-container" style="max-height: 300px;"></div>
            
            <div class="signature-section">
                <label>Technician Signature:</label>
                <img id="tech-signature-img" style="width: 100%; border: 1px dashed #ccc; border-radius: 8px;" />
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Approval Comments / Rejection Reason:</label>
                <input type="text" id="approval-comment" class="note-input" placeholder="Optional comments..." style="padding: 10px; font-size: 14px;">
            </div>

            <div class="action-buttons">
                <button class="approve-btn" onclick="approvePM()">✅ Approve</button>
                <button class="reject-btn" onclick="rejectPM()">❌ Reject</button>
            </div>
        </div>
    </div>    <!-- ================= REPORTS SCREEN ================= -->
    <div id="reports-screen" class="screen">
        <div class="dashboard-box" style="max-width: 100%;">
            <h2>PM Reports</h2>
            <button class="back-btn no-print" onclick="hideReportsScreen()">← Back to Dashboard</button>
            
            <div class="report-controls no-print">
                <label>Filter by Status:</label>
                <select id="report-filter" onchange="renderReportsTable()">
                    <option value="approved">Approved (For Audit)</option>
                    <option value="pending">Pending</option>
                    <option value="rejected">Rejected</option>
                    <option value="all">All Records</option>
                </select>
                <button class="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
                <button class="print-btn" onclick="printReport()">🖨️ Print PDF</button>
            </div>

            <div class="table-container">
                <table id="reports-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Tag Number</th>
                            <th>Department</th>
                            <th>Location</th>
                            <th>Technician</th>
                            <th>Status</th>
                            <th>Approved By</th>
                        </tr>
                    </thead>
                    <tbody id="reports-tbody">
                        <!-- Rows generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

     <script src="js/technician.js"></script>
    <script src="js/incharge.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
